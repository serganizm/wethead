<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="wethead — проекты">
  <title>wethead</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1 class="sr-only">wethead</h1>
      <img
        class="avatar"
        src="avatar.jpg"
        alt="wethead"
        width="120"
        height="120"
        decoding="async"
      >
    </header>

    <section id="projects" class="list" aria-label="Проекты"></section>
  </main>

  <script src="projects.js"></script>
  <script>
    (function () {
      var root = document.getElementById("projects");
      var projects = window.WETHEAD_PROJECTS || [];

      if (!projects.length) {
        root.innerHTML = '<p class="empty">Пока нет проектов</p>';
        return;
      }

      var frag = document.createDocumentFragment();

      projects.forEach(function (project) {
        var link = document.createElement("a");
        link.className = "project-card";
        link.href = project.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        var icon = document.createElement("span");
        icon.className = "row-icon";
        icon.setAttribute("aria-hidden", "true");

        if (project.icon && /\.(png|jpe?g|webp|svg|gif)$/i.test(project.icon)) {
          var img = document.createElement("img");
          img.src = project.icon;
          img.alt = "";
          icon.appendChild(img);
        } else {
          icon.textContent = project.icon || project.title.charAt(0);
        }

        var copy = document.createElement("span");
        copy.className = "row-copy";

        var title = document.createElement("span");
        title.className = "row-title";
        title.textContent = project.title;

        var meta = document.createElement("span");
        meta.className = "row-meta";
        meta.textContent = project.description || "";

        copy.appendChild(title);
        copy.appendChild(meta);

        var chevron = document.createElement("span");
        chevron.className = "chevron";
        chevron.setAttribute("aria-hidden", "true");
        chevron.textContent = "›";

        link.appendChild(icon);
        link.appendChild(copy);
        link.appendChild(chevron);
        frag.appendChild(link);
      });

      root.appendChild(frag);
    })();
  </script>
</body>
</html>
